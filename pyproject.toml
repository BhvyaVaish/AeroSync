[project]
name = "aerosync"
version = "1.0.0"
description = "Touchless, vision-driven workspace synchronization across multiple computers triggered by webcam hand gestures."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bhvya Vaish" }
]
license = { text = "MIT" }
keywords = ["workspace-sync", "mediapipe", "computer-vision", "fastapi", "react", "gestures", "productivity"]

[tool.pytest.ini_options]
testpaths = ["apps/relay_server/tests", "services", "tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
